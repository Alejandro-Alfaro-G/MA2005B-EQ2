services:
  test:
    image: ubuntu/bind9:latest
    container_name: dns-test
    networks:
      dns-net:
        ipv4_address: 172.30.0.70
    volumes:
      - ./test/named.conf:/etc/bind/named.conf:ro
      - ./test/zones:/var/lib/bind
    restart: unless-stopped

  test-hijos:
    image: ubuntu/bind9:latest
    container_name: dns-test-hijos
    networks:
      dns-net:
        ipv4_address: 172.30.0.80
    volumes:
